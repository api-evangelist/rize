description: Rize (Rize Money, Inc. / RizeFS) was a Banking-as-a-Service and embedded-finance
  platform that offered unified banking, brokerage, and payments APIs, letting companies
  embed savings, checking, and investment accounts directly into their own products.
  Rize was acquired by Fifth Third Bancorp in 2023; the standalone rizefs.com developer
  and API surface has since been decommissioned, with no live documentation, OpenAPI,
  or reachable endpoints found during this enrichment pass. The registered domain still
  publishes SPF and DMARC (reject) email records but serves no web or API hosts.
